[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# La URL real se toma de app.core.config (variable TABLERO_DATABASE_URL) en
# env.py. Este valor queda vacío a propósito para que no haya dos fuentes de
# verdad sobre a qué base de datos se migra.
sqlalchemy.url =

# Revisiones con fecha en el nombre: el orden cronológico es legible sin
# abrir los archivos.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
